services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:latest
    container_name: fireant-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${POSTGREST_DB_URI:-postgresql://finance:finance@postgres:5432/finance}
      PGRST_DB_SCHEMA: ${POSTGREST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${POSTGREST_DB_ANON_ROLE:-finance}
      PGRST_SERVER_PORT: 3000
      PGRST_OPENAPI_SERVER_PROXY_URI: ${POSTGREST_OPENAPI_SERVER_PROXY_URI:-http://localhost:3000}
    ports:
      - "${POSTGREST_PORT:-3000}:3000"

  redis:
    image: redis:8-alpine
    container_name: fireant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - fireant_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - finance_qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: finance-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/finance123456}
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - finance_neo4j_data:/data
      - finance_neo4j_logs:/logs

  api:
    build:
      context: ../../
      dockerfile: app/Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-api
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["python", "/app/app/main.py", "serve"]

  celery-worker:
    build:
      context: ../../
      dockerfile: app/Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-celery-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      [
        "python",
        "-m",
        "services.finance_report.worker.processes.worker"
      ]

  celery-beat:
    build:
      context: ../../
      dockerfile: app/Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-celery-beat
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      [
        "python",
        "-m",
        "services.finance_report.worker.processes.beat"
      ]

volumes:
  finance_postgres_data:
  fireant_redis_data:
  finance_qdrant_data:
  finance_neo4j_data:
  finance_neo4j_logs:
