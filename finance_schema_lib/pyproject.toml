[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-schema"
version = "0.1.0"
description = "Shared SQLAlchemy models and Alembic migrations for finance projects."
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
finance-schema = "finance_schema.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["finance_schema*"]

[tool.setuptools.package-data]
finance_schema = [
    "alembic.ini",
    "migrations/README",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]
