[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-api-service"
version = "0.1.0"
description = "API-first finance data ingestion service with FastAPI, Celery, Redis, and PostgreSQL."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "celery[redis]>=5.4,<6",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "redis>=5,<6",
    "loguru>=0.7,<1",
    "pandas>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "openai>=1.0,<2",
    "langchain>=0.3,<1",
    "langgraph>=0.2,<1",
    "langchain-openai>=0.2,<1",
    "langchain-qdrant>=0.2,<1",
    "qdrant-client>=1.11,<2",
    "neo4j>=5.25,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
finance-api = "main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
