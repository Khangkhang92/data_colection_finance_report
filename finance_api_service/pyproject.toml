[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-api-service"
version = "0.1.0"
description = "API-first finance data ingestion service for n8n workflows."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
    "pandas>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "finance-schema>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
finance-api = "finance_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
