services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fireant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - fireant_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["/bin/sh", "-lc", "finance-schema upgrade head && finance-api serve"]

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      [
        "celery",
        "-A",
        "finance_api.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}"
      ]

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        FINANCE_SCHEMA_REPO: ${FINANCE_SCHEMA_REPO:-ssh://git@github.com/Khangkhang92/schema_lib.git}
        FINANCE_SCHEMA_REF: ${FINANCE_SCHEMA_REF:-main}
    container_name: fireant-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@postgres:5432/finance}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      [
        "celery",
        "-A",
        "finance_api.celery_app:celery_app",
        "beat",
        "--loglevel=INFO"
      ]

volumes:
  finance_postgres_data:
  fireant_redis_data:
